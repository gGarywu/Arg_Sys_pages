<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f3b32" />
    <meta
      name="description"
      content="授業ごとの資料と最近の更新を確認できる、シンプルな資料一覧です。"
    />
    <title>ARG / SYS — Course Library</title>
    <link rel="stylesheet" href="./styles.css?v=20261112-links" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="ARG SYS ホーム">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>ARG <i>/</i> SYS</span>
      </a>
      <nav aria-label="ページ内ナビゲーション">
        <a href="#whats-new">What’s New</a>
        <a href="#courses">Courses</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">COURSE LIBRARY</p>
        <h1 id="hero-title">授業資料を、<br />すぐ見つける。</h1>
        <p class="hero-copy">
          科目と授業回ごとに、利用できる資料をまとめています。
        </p>
        <div class="summary" aria-label="資料一覧の概要">
          <span><strong id="courseCount">—</strong> courses</span>
          <span><strong id="fileCount">—</strong> files</span>
          <span>Updated <strong id="updatedAt">—</strong></span>
        </div>
      </section>

      <section
        class="section whats-new-section"
        id="whats-new"
        aria-labelledby="whats-new-title"
      >
        <div class="section-heading">
          <p class="section-label">01</p>
          <div>
            <h2 id="whats-new-title">What’s New</h2>
            <p>最近追加・更新された資料のお知らせです。</p>
          </div>
        </div>
        <div class="whats-new-scene">
          <img
            class="birdman birdman-left"
            src="./assets/birdman-left.png"
            alt=""
            aria-hidden="true"
          />
          <div class="updates" id="updates" aria-live="polite">
            <p class="loading">読み込んでいます…</p>
          </div>
          <img
            class="birdman birdman-right"
            src="./assets/birdman-right.png"
            alt=""
            aria-hidden="true"
          />
        </div>
      </section>

      <section class="section" id="courses" aria-labelledby="courses-title">
        <div class="section-heading">
          <p class="section-label">02</p>
          <div>
            <h2 id="courses-title">Courses</h2>
            <p>科目を開くと、授業回ごとの資料を確認できます。</p>
          </div>
        </div>
        <div class="course-list" id="courseList" aria-live="polite">
          <p class="loading">読み込んでいます…</p>
        </div>
      </section>
    </main>

    <footer>
      <span>ARG / SYS</span>
      <span>Course Library</span>
    </footer>

    <script type="module" src="./app.mjs?v=20261112-links"></script>
  </body>
</html>
